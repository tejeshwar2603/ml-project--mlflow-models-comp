name: mlflow-comp

networks:
  mlflowcomp-net:
    name: mlflowcomp-net

volumes:
  mlflowcomp-postgres-data:
  mlflowcomp-zk-data:
  mlflowcomp-kafka-data:
  mlflowcomp-minio-data:

services:
  # ---------------- MinIO (S3-compatible object storage: 3rd dataset ingestion path) ----------------
  # A .csv/.xlsx dropped into the bucket below triggers a bucket-notification webhook
  # at POST /storage/events (see api.py) the instant it's created/overwritten - MinIO
  # is a third source for the same ingestion pipeline manual upload and Kafka already
  # feed, not a separate one. See ARCHITECTURE.md for the full flow.
  minio:
    image: minio/minio:latest
    container_name: mlflowcomp-minio
    networks: [mlflowcomp-net]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # Notification target defined at startup via env vars, not `mc admin config
      # set` + `mc admin service restart` at runtime - that restart needs an
      # interactive TTY to confirm, which doesn't exist in a non-interactive
      # init container. minio-init below only has to create the bucket and bind
      # the event to this already-registered target - no restart required.
      MINIO_NOTIFY_WEBHOOK_ENABLE_datasets: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_datasets: "http://host.docker.internal:8000/storage/events"
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_datasets: ${MINIO_WEBHOOK_TOKEN:-changeme-webhook-token}
    ports:
      - "9010:9000" # S3 API (9000 is taken by an unrelated local MinIO instance)
      - "9011:9001" # web console
    volumes:
      - mlflowcomp-minio-data:/data
    command: server /data --console-address ":9001"
    # The webhook it fires on object-create needs to reach the FastAPI app, which
    # runs directly on the host (not in this compose stack) via `python run_api.py`.
    # host.docker.internal resolves automatically on Docker Desktop (Windows/Mac);
    # this extra_hosts entry is what makes the same thing work on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  minio-init:
    image: minio/mc:latest
    container_name: mlflowcomp-minio-init
    networks: [mlflowcomp-net]
    depends_on: [minio]
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done
        mc mb -p local/cpu-utilization-datasets
        mc event add local/cpu-utilization-datasets arn:minio:sqs::datasets:webhook --event put --suffix .csv || true
        mc event add local/cpu-utilization-datasets arn:minio:sqs::datasets:webhook --event put --suffix .xlsx || true
        echo "MinIO bucket 'cpu-utilization-datasets' + webhook notification configured."
  # ---------------- Kafka (single broker, simulated telemetry ingestion) ----------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: mlflowcomp-zookeeper
    networks: [mlflowcomp-net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2182:2181"
    volumes:
      - mlflowcomp-zk-data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: mlflowcomp-kafka
    networks: [mlflowcomp-net]
    depends_on: [zookeeper]
    ports:
      - "9095:9095"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,HOST://0.0.0.0:9095
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9095
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - mlflowcomp-kafka-data:/var/lib/kafka/data

  # ---------------- Airflow (LocalExecutor, no celery/redis needed) ----------------
  airflow-postgres:
    image: postgres:13
    container_name: mlflowcomp-airflow-postgres
    networks: [mlflowcomp-net]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"
    volumes:
      - mlflowcomp-postgres-data:/var/lib/postgresql/data

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: mlflowcomp-airflow-init
    networks: [mlflowcomp-net]
    depends_on: [airflow-postgres]
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      # Postgres, not the old bind-mounted sqlite file - a Linux container reading a
      # SQLite file that lives on the Windows host via Docker Desktop's bind mount hits
      # "disk I/O error" reliably (SQLite needs POSIX file locks the bind mount can't
      # provide). Postgres is a real client-server DB so this isn't an issue.
      MLFLOW_TRACKING_URI: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/mlflow
      PROJECT_DIR: /opt/airflow/project
    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/airflow/project
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: mlflowcomp-airflow-webserver
    networks: [mlflowcomp-net]
    depends_on: [airflow-init]
    environment: *airflow-env
    ports:
      - "8090:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/airflow/project
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: mlflowcomp-airflow-scheduler
    networks: [mlflowcomp-net]
    depends_on: [airflow-init]
    environment: *airflow-env
    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/airflow/project
    command: scheduler
